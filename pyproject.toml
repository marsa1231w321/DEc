[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.pyright]
include = [
    "dec_engine/scene.py",
    "dec_engine/logic.py",
    "dec_engine/validation.py",
    "dec_engine/playtest.py",
    "tests",
]
exclude = [".venv", "**/__pycache__"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.10"
typeCheckingMode = "basic"

[tool.ruff]
target-version = "py310"
line-length = 88
exclude = [".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
