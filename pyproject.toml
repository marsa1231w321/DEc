[project]
name = "dec-engine"
version = "0.1.0"
requires-python = ">=3.10,<3.16"
dependencies = [
    "glfw>=2.7.0",
    "moderngl>=5.10.0",
    "numpy>=1.26.0",
    "Pillow>=10.0.0",
    "trimesh>=4.0.0",
    "pygltflib>=1.16.0",
    "PyOpenGL>=3.1.0",
    "PyOpenGL-accelerate>=3.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pyright>=1.1.400",
    "ruff>=0.11",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.pyright]
include = [
    "dec_engine/scene.py",
    "dec_engine/logic.py",
    "dec_engine/validation.py",
    "dec_engine/playtest.py",
    "dec_engine/gizmo.py",
    "tests",
]
exclude = [".venv", "**/__pycache__"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.10"
typeCheckingMode = "basic"

[tool.ruff]
target-version = "py310"
line-length = 88
exclude = [".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
