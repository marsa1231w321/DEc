name: DEc CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.15"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            uv.lock

      - name: Install pinned uv
        run: python -m pip install uv==0.13.6

      - name: Sync locked project and development dependencies
        run: uv sync --locked --python ${{ matrix.python-version }} --group dev

      - name: Lint with Ruff
        run: uv run --locked --python ${{ matrix.python-version }} python -m ruff check dec_engine tests

      - name: Check formatting with Ruff
        run: uv run --locked --python ${{ matrix.python-version }} python -m ruff format --check tests

      - name: Type check with Pyright
        run: uv run --locked --python ${{ matrix.python-version }} python -m pyright

      - name: Run headless tests
        run: uv run --locked --python ${{ matrix.python-version }} python -m pytest -q
